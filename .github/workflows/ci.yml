name: ci

# Test + typecheck gate. The gitleaks workflow only proves "no secrets
# leaked" — this proves the build compiles and the suites pass, so a green
# overall CI status actually means the code is shippable.
#
# Build-before-test ordering matters: several backend tests inspect built
# artifacts rather than source —
#   - tests/package-shape.test.ts asserts `dist-cli/cli/index.js` AND
#     `frontend/dist/index.html` appear in `npm pack --dry-run`
#   - tests/cli-bin-smoke.test.ts runs `node dist-cli/cli/index.js --help`
#   - tests/mermaid-bundle.test.ts self-builds the frontend but needs
#     frontend/node_modules installed
# So we build the CLI (`build:cli`) and the frontend dist (`npm run build`,
# which runs `cd frontend && npm install && npx vite build`) BEFORE the
# backend suite. This mirrors what a clean local run must do.
#
# The OS matrix is the support policy, executable. vibedocs claims Linux and
# macOS support (see README "Supported platforms"); both are exercised here so
# the claim is tested rather than asserted. macOS matters specifically because
# it differs from Linux in ways this codebase touches: a case-insensitive
# filesystem (path-resolver's allowlists and traversal checks), APFS readdir
# ordering (discovery sorts, but the guarantee should be proven), symlinked
# `os.tmpdir()` under /var -> /private/var (most fixtures build there), and
# fsevents-backed chokidar instead of inotify. Windows is deliberately absent
# until it is actually supported.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: build + typecheck + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one platform's failure cancel the other — when something is
      # platform-specific, seeing which side went red is the whole diagnosis.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend deps
        run: npm install

      - name: Build CLI (produces dist-cli/)
        run: npm run build:cli

      - name: Typecheck CLI
        run: npm run typecheck

      # `npm run build` = `cd frontend && npm install && npx vite build`.
      # This installs frontend deps AND produces frontend/dist/, which the
      # backend package-shape test requires.
      #
      # It is NOT a typecheck: Vite strips types through esbuild without checking
      # them, so a build stays green over broken types. That is what the next step
      # is for, and it has to come after this one because it needs the deps this
      # step installs.
      - name: Build frontend (installs frontend deps + produces frontend/dist/)
        run: npm run build

      # `tsc -b`, not `tsc --noEmit`: frontend/tsconfig.json is solution-style
      # (`files: []` + project references), so a bare --noEmit there checks
      # nothing and exits 0 — which is how the frontend went unchecked entirely.
      #
      # This is also what enforces the WS protocol's exhaustiveness guarantee.
      # src/shared/ws-messages.ts documents that a new message variant "will cause
      # TypeScript compile errors in any unhandled call-site", and handleWsMessage
      # does have the `never` check — but a documented compile error is only a
      # guarantee if something compiles. Nothing did.
      - name: Typecheck frontend
        run: npm run typecheck:frontend

      - name: Backend tests
        run: npx vitest run

      - name: Frontend tests
        run: cd frontend && npx vitest run

  # What a real `npm publish` would actually put on the registry, proven from a
  # clean checkout. This is deliberately NOT a unit test: the bug it guards
  # against lives in npm's lifecycle, not in our code. `prepare` used to
  # discriminate on INIT_CWD alone, which made `npm publish` (run from the
  # package root) look identical to a local dev self-install — so it skipped the
  # Vite build and published a tarball with zero frontend assets. Nothing caught
  # it: the `test` job builds frontend/dist explicitly beforehand, and
  # tests/package-shape.test.ts packs with --ignore-scripts, so both saw a
  # locally-built artifact that a publish would never have produced.
  #
  # The essential ingredients are (a) no prior build step and (b) no
  # --ignore-scripts, so the lifecycle runs exactly as it would on publish.
  publish-rehearsal:
    name: publish rehearsal (tarball contents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend deps
        run: npm install

      # No `npm run build` here — on purpose. If `prepare` doesn't build the
      # frontend during pack, this is what fails.
      #
      # The assertions live in scripts/tarball-contract.mjs (pure, unit-tested
      # in tests/tarball-contract.test.ts) and are driven by pack:inspect, so
      # this job and the local `npm run pack:inspect` pre-flight enforce one
      # contract rather than two copies of a list that drift.
      - name: Pack as `npm publish` would, and assert the runtime surface
        run: npm run pack:inspect

      - name: Smoke-test the packed tarball as a consumer would
        run: |
          set -euo pipefail
          mkdir -p /tmp/rehearsal
          npm pack --pack-destination /tmp/rehearsal
          tarball=$(ls /tmp/rehearsal/vibedocs-*.tgz)
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$tarball"
          npx vibedocs --help
